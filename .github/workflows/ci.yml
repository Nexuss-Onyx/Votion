name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages and apps
        run: pnpm turbo run build

      - name: Run ESLint across workspace
        run: pnpm turbo run lint

      - name: Run TypeScript typecheck across workspace
        run: pnpm turbo run typecheck

      - name: Run unit and integration test suites
        run: pnpm turbo run test --concurrency=2

      - name: Verify Wasmer Edge manifest and deploy script dry-run
        run: ./tooling/wasmer/deploy.sh --dry-run
